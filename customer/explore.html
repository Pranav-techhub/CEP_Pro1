<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explore Vendors & Menus — TeaRoute</title>
  <link rel="stylesheet" href="/assets/css/main.css">
  <link rel="stylesheet" href="/assets/css/dashboard.css">
  <link rel="stylesheet" href="/assets/css/components.css">
</head>
<body>
  <div class="app-shell">
    <aside class="app-sidebar" id="dashboard-sidebar"></aside>

    <main class="app-main">
      <header class="app-topbar">
        <div class="topbar-left">
          <h1 class="topbar-title">Explore Hub</h1>
        </div>
        <div class="topbar-right">
          <a href="/customer/cart.html" class="btn btn-secondary btn-sm">
            🛒 My Cart (<span id="cart-count">0</span>)
          </a>
        </div>
      </header>

      <div class="app-content">
        <!-- Search & Filter Controls -->
        <div class="card" style="margin-bottom: 2rem; padding: 1.25rem;">
          <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
            <div style="flex: 1; min-width: 260px;">
              <input type="text" id="search-input" class="form-control" placeholder="Search chai, poha, biryani, samosas, bakeries...">
            </div>
            <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;" id="category-pills">
              <button class="btn btn-secondary btn-sm active-filter" data-cat="ALL">All Items</button>
              <button class="btn btn-secondary btn-sm" data-cat="Chai & Beverages">☕ Chai & Beverages</button>
              <button class="btn btn-secondary btn-sm" data-cat="Breakfast">🍳 Breakfast & Poha</button>
              <button class="btn btn-secondary btn-sm" data-cat="Snacks">🥟 Hot Snacks & Vada Pav</button>
              <button class="btn btn-secondary btn-sm" data-cat="Main Course">🍛 Gourmet Dining</button>
            </div>
          </div>
        </div>

        <!-- Products Grid -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem;">
          <h2 id="section-heading">Available Menu Items</h2>
          <span style="font-size: 0.85rem; color: var(--text-muted);" id="item-count-label">Showing all items</span>
        </div>

        <div class="grid grid-cols-3 gap-6" id="products-grid">
          <!-- Dynamically populated products -->
        </div>
      </div>
    </main>
  </div>

  <script type="module">
    import { renderDashboardSidebar } from '/src/components/sidebar.js';
    import { store } from '/src/services/store.js';
    import { notifications } from '/src/services/notificationService.js';

    renderDashboardSidebar('customer', 'explore');

    const products = store.getProducts();
    const businesses = store.getBusinesses();
    const grid = document.getElementById('products-grid');
    const searchInput = document.getElementById('search-input');
    const categoryBtns = document.querySelectorAll('#category-pills button');
    let currentCategory = 'ALL';

    function updateCartCount() {
      const cart = store.getCart();
      const count = cart.reduce((s, i) => s + i.quantity, 0);
      document.getElementById('cart-count').innerText = count;
    }
    updateCartCount();

    function renderProducts() {
      const query = searchInput.value.toLowerCase().trim();

      const filtered = products.filter(p => {
        const matchesCat = currentCategory === 'ALL' || p.category.toLowerCase().includes(currentCategory.toLowerCase());
        const matchesQuery = p.name.toLowerCase().includes(query) || 
                             p.description.toLowerCase().includes(query) ||
                             p.category.toLowerCase().includes(query);
        return matchesCat && matchesQuery;
      });

      document.getElementById('item-count-label').innerText = `${filtered.length} items available`;

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div style="grid-column: 1 / -1; text-align: center; padding: 4rem 1rem;">
            <div style="font-size: 3rem; margin-bottom: 0.5rem;">🔍</div>
            <h3>No matching products found</h3>
            <p>Try searching for chai, samosa, poha, or change your category filter.</p>
          </div>
        `;
        return;
      }

      grid.innerHTML = filtered.map(p => {
        const biz = businesses.find(b => b.id === p.businessId) || { name: 'TeaRoute Vendor' };
        return `
          <div class="card card-interactive" style="overflow: hidden; padding: 0; display: flex; flex-direction: column;">
            <img src="${p.image}" alt="${p.name}" style="width: 100%; height: 160px; object-fit: cover;">
            <div style="padding: 1.25rem; flex: 1; display: flex; flex-direction: column;">
              <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.35rem;">
                <h4 style="font-size: 1.05rem;">${p.name}</h4>
                <span style="font-family: var(--font-display); font-size: 1.15rem; font-weight: 700; color: var(--primary-gold);">₹${p.price}</span>
              </div>
              <div style="font-size: 0.75rem; color: var(--primary-gold); margin-bottom: 0.5rem; font-weight: 600;">
                📍 ${biz.name} • ⏱ ~${p.prepTimeMins || 10}m prep
              </div>
              <p style="font-size: 0.85rem; color: var(--text-secondary); line-height: 1.4; margin-bottom: 1.25rem; flex: 1;">
                ${p.description}
              </p>
              <button class="btn btn-primary btn-sm add-cart-btn" data-id="${p.id}" style="width: 100%;">
                + Add to Cart
              </button>
            </div>
          </div>
        `;
      }).join('');

      // Add click handlers
      document.querySelectorAll('.add-cart-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const prodId = btn.getAttribute('data-id');
          const prod = products.find(p => p.id === prodId);
          if (prod) {
            store.addToCart(prod, 1);
            updateCartCount();
            notifications.showToast(`Added ${prod.name} to cart.`, 'success', 'Cart Updated');
          }
        });
      });
    }

    renderProducts();

    searchInput.addEventListener('input', renderProducts);

    categoryBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        categoryBtns.forEach(b => {
          b.classList.remove('btn-primary');
          b.classList.add('btn-secondary');
        });
        btn.classList.remove('btn-secondary');
        btn.classList.add('btn-primary');
        currentCategory = btn.getAttribute('data-cat');
        renderProducts();
      });
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Order History — TeaRoute</title>
  <link rel="stylesheet" href="/assets/css/main.css">
  <link rel="stylesheet" href="/assets/css/dashboard.css">
  <link rel="stylesheet" href="/assets/css/components.css">
</head>
<body>
  <div class="app-shell">
    <aside class="app-sidebar" id="dashboard-sidebar"></aside>

    <main class="app-main">
      <header class="app-topbar">
        <div class="topbar-left">
          <h1 class="topbar-title">Order History & Invoices</h1>
        </div>
        <div class="topbar-right">
          <button id="export-csv-btn" class="btn btn-secondary btn-sm">Export Orders (CSV)</button>
        </div>
      </header>

      <div class="app-content">
        <div class="card">
          <div class="table-container">
            <table class="table">
              <thead>
                <tr>
                  <th>Order Ref</th>
                  <th>Placed At</th>
                  <th>Merchant Hub</th>
                  <th>Dishes & Items</th>
                  <th>Amount</th>
                  <th>Payment</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="orders-table-body">
                <!-- Dynamically populated -->
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- A4 Invoice Modal -->
  <div id="invoice-modal" class="modal-backdrop">
    <div class="modal-card" style="max-width: 820px; background: transparent; border: none; box-shadow: none;">
      <div style="display: flex; justify-content: flex-end; margin-bottom: 0.5rem; gap: 0.5rem;">
        <button id="print-invoice-btn" class="btn btn-primary btn-sm">🖨️ Print / Save PDF</button>
        <button id="close-invoice-modal" class="btn btn-secondary btn-sm">✕ Close</button>
      </div>
      <div id="invoice-modal-content"></div>
    </div>
  </div>

  <script type="module">
    import { renderDashboardSidebar } from '/src/components/sidebar.js';
    import { store } from '/src/services/store.js';
    import { billingService } from '/src/services/billingService.js';

    renderDashboardSidebar('customer', 'orders');

    const orders = store.getOrders();
    const tbody = document.getElementById('orders-table-body');

    function renderOrdersTable() {
      if (orders.length === 0) {
        tbody.innerHTML = `<tr><td colspan="8" style="text-align: center; padding: 3rem;">No orders found.</td></tr>`;
        return;
      }

      tbody.innerHTML = orders.map(o => {
        const dateStr = new Date(o.createdAt).toLocaleDateString('en-IN', {
          month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
        });

        const statusBadges = {
          'Delivered': 'badge-emerald',
          'On the Way': 'badge-orange',
          'Arriving Soon': 'badge-orange',
          'Ready for Pickup': 'badge-gold',
          'Preparing': 'badge-blue',
          'Scheduled': 'badge-gray'
        };
        const badgeClass = statusBadges[o.status] || 'badge-gold';

        return `
          <tr>
            <td><strong>#${o.id}</strong></td>
            <td style="color: var(--text-muted); font-size: 0.85rem;">${dateStr}</td>
            <td><strong>${o.businessName || 'Sharmaji Chai'}</strong></td>
            <td>${o.items.map(i => `${i.name} (x${i.quantity})`).join(', ')}</td>
            <td><strong>₹${o.totalAmount}</strong></td>
            <td><span class="badge badge-emerald">${o.paymentStatus || 'PAID'}</span></td>
            <td><span class="badge ${badgeClass}">${o.status}</span></td>
            <td>
              <div style="display: flex; gap: 0.4rem;">
                <button class="btn btn-secondary btn-sm view-invoice-btn" data-id="${o.id}">
                  Invoice
                </button>
                <a href="/customer/tracking.html?orderId=${o.id}" class="btn btn-primary btn-sm">
                  Track
                </a>
              </div>
            </td>
          </tr>
        `;
      }).join('');

      // Invoice clicks
      document.querySelectorAll('.view-invoice-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const orderId = btn.getAttribute('data-id');
          const order = store.getOrderById(orderId);
          if (order) {
            const html = billingService.generateInvoiceHtml(order);
            document.getElementById('invoice-modal-content').innerHTML = html;
            document.getElementById('invoice-modal').classList.add('open');
          }
        });
      });
    }

    renderOrdersTable();

    // Modal controls
    document.getElementById('close-invoice-modal').addEventListener('click', () => {
      document.getElementById('invoice-modal').classList.remove('open');
    });

    document.getElementById('print-invoice-btn').addEventListener('click', () => {
      window.print();
    });

    // CSV Export
    document.getElementById('export-csv-btn').addEventListener('click', () => {
      billingService.exportOrdersToCsv(orders);
    });
  </script>
</body>
</html>
